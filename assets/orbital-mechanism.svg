<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#55504A"/>
      <stop offset="48%" stop-color="#E8E0D0"/>
      <stop offset="72%" stop-color="#C6A66B"/>
      <stop offset="100%" stop-color="#55504A"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0%" stop-color="#C6A66B" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#17191C" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" rx="8" fill="#17191C"/>
  <circle cx="450" cy="130" r="120" fill="url(#core)"/>

  <!-- Technical frame -->
  <g fill="none" stroke="#55504A" stroke-width="1">
    <path d="M30 28 H240 M660 28 H870"/>
    <path d="M30 232 H240 M660 232 H870"/>
    <path d="M30 28 V48 M870 28 V48 M30 212 V232 M870 212 V232"/>
    <path d="M55 38 H210 M690 38 H845" stroke-opacity=".6"/>
    <path d="M55 222 H210 M690 222 H845" stroke-opacity=".6"/>
  </g>

  <!-- Stationary engraved rings -->
  <g fill="none" stroke="url(#gold)">
    <circle cx="450" cy="130" r="91" stroke-width="1.2"/>
    <circle cx="450" cy="130" r="105" stroke-width=".7" stroke-dasharray="2 7"/>
    <circle cx="450" cy="130" r="72" stroke-width=".8" stroke-dasharray="24 5 3 5"/>
    <path d="M450 20 V49 M450 211 V240 M340 130 H369 M531 130 H560"/>
    <path d="M372 52 L391 71 M509 189 L528 208
             M528 52 L509 71 M391 189 L372 208"/>
  </g>

  <!-- Rotating celestial ring -->
  <g transform="translate(450 130)">
    <g fill="none" stroke="#C6A66B" stroke-width="1.3">
      <ellipse rx="78" ry="34" transform="rotate(-35)"/>
      <ellipse rx="78" ry="34" transform="rotate(35)"/>
    </g>
    <g fill="none" stroke="#E8E0D0" stroke-width=".8"
       stroke-dasharray="3 10">
      <circle r="60"/>
    </g>
    <animateTransform attributeName="transform"
      type="rotate" from="0 0 0" to="360 0 0"
      dur="36s" repeatCount="indefinite"/>
  </g>

  <!-- Orbital markers -->
  <g>
    <circle cx="450" cy="39" r="4" fill="#C6A66B" filter="url(#glow)"/>
    <circle cx="450" cy="221" r="3" fill="#E8E0D0"/>
    <circle cx="359" cy="130" r="3" fill="#C6A66B"/>
    <circle cx="541" cy="130" r="3" fill="#C6A66B"/>
  </g>

  <!-- Central machine -->
  <g transform="translate(450 130)" fill="none" stroke="url(#gold)">
    <circle r="34" stroke-width="1.4"/>
    <circle r="26" stroke-width=".8" stroke-dasharray="2 4"/>
    <path d="M0 -23 L7 -7 L23 0 L7 7 L0 23 L-7 7 L-23 0 L-7 -7 Z"
          stroke-width="1.2"/>
    <circle r="11" stroke-width="1.5"/>
    <circle r="4" fill="#C6A66B" filter="url(#glow)"/>
    <animateTransform attributeName="transform"
      type="rotate" from="0" to="360"
      dur="18s" repeatCount="indefinite"/>
  </g>

  <!-- Engraved title -->
  <g text-anchor="middle" fill="#E8E0D0">
    <text x="450" y="15" font-family="serif" font-size="9"
          letter-spacing="4" fill="#C6A66B">MECHANICA • MMXXVI</text>
    <text x="450" y="253" font-family="serif" font-size="9"
          letter-spacing="3" fill="#C6A66B">INTELLIGENCE IN MOTION</text>
  </g>

  <!-- Side calibration marks -->
  <g stroke="#C6A66B" stroke-width="1" opacity=".8">
    <path d="M250 120 H300 M260 130 H315 M250 140 H300"/>
    <path d="M600 120 H650 M585 130 H640 M600 140 H650"/>
  </g>
  <g fill="#C6A66B">
    <circle cx="250" cy="130" r="2"/>
    <circle cx="650" cy="130" r="2"/>
  </g>
</svg>
