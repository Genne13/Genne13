
name: Refresh the Arcane Archive

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/profile-archive.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the archive
        uses: actions/checkout@v4

      - name: Generate contribution animation
        uses: Platane/snk@v3
        with:
          github_user_name: Genne13
          outputs: |
            output/github-snake.svg?color_snake=%23C6A66B&color_dots=%2317191C%2C%2329251F%2C%2355504A%2C%238D7956%2C%23C6A66B
            output/github-snake-dark.svg?palette=github-dark&color_snake=%23C6A66B&color_dots=%2317191C%2C%2329251F%2C%2355504A%2C%238D7956%2C%23C6A66B

      - name: Commit generated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution artwork"
            git push
          fi

